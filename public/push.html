<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Maida Notification Controller</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #7b7bc5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #d9381e;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #b82c16;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Push Live Notification</h2>
    <div class="form-group">
      <label for="msgInput">Notification Text:</label>
      <input type="text" id="msgInput" placeholder="Type notification text here...">
    </div>
    <button id="sendBtn">Push Notification</button>
    <div id="status"></div>
  </div>

  <script>
    // Create or join a broadcast channel named 'al_maida_notifications'
    const channel = new BroadcastChannel("al_maida_notifications");

    const sendBtn = document.getElementById("sendBtn");
    const msgInput = document.getElementById("msgInput");
    const status = document.getElementById("status");

    sendBtn.addEventListener("click", () => {
      const text = msgInput.value.trim();

      if (!text) {
        status.style.color = "red";
        status.innerText = "Please enter text first!";
        return;
      }

      // Broadcast the message text directly to other open tabs
      channel.postMessage({ text: text });

      status.style.color = "green";
      status.innerText = "Notification Pushed!";
      msgInput.value = "";

      setTimeout(() => {
        status.innerText = "";
      }, 3000);
    });
  </script>
</body>
</html>
